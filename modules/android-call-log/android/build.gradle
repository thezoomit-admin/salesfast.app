plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.androidcalllog'
version = '1.0.0'

android {
  namespace "expo.modules.androidcalllog"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // JVM unit tests of the WhatsApp call rules (not shipped in the APK).
  testImplementation 'junit:junit:4.13.2'
}
