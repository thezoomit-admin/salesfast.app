# Deploy ONLY the SalesFast APK download website to GitHub Pages.
# Does not build or modify the Expo / EAS mobile application.
name: Deploy Download Website

on:
  push:
    branches:
      - main
      - abdullah
    paths:
      - 'download-website/**'
      - '.github/workflows/deploy-download-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-download-website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: download-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: download-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          # Project Pages URL: https://<owner>.github.io/salesfast.app/
          VITE_BASE_PATH: /salesfast.app/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: download-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
